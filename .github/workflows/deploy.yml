name: CD - Build & Deploy

# 触发条件：仅 push 到 main 分支
on:
  push:
    branches: [main]

env:
  # 阿里云 ACR 配置（国内节点，规避 GHCR 拉取超时）
  # ACR_REGISTRY 形如 registry.cn-hangzhou.aliyuncs.com（默认杭州，可改其他地域）
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: cc468547730
  IMAGE_NAME: my-blog

jobs:
  # 第一步：快速检查（无需等待外部 CI）
  check:
    name: Django 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django 系统检查
        run: python manage.py check

      - name: 运行测试
        run: python manage.py test

  # 第二步：检查通过后构建镜像并部署
  build-and-deploy:
    name: 构建镜像 → 推送阿里云 ACR → 部署
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          # 注意：需在仓库 Secrets 配置
          #   ACR_USERNAME  = 阿里云账号全名（如 1234567890@1234567890.com 或 RAM 子账号）
          #   ACR_PASSWORD  = 容器镜像服务专属密码（在 ACR 控制台「访问凭证」设置，非登录密码）

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 远程部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "==> 登录阿里云 ACR"
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            echo "==> 拉取最新镜像（ACR 国内节点，速度稳定）"
            time docker compose -f docker-compose.yml pull
            echo "==> 重启容器"
            docker compose -f docker-compose.yml up -d --remove-orphans
            echo "==> 清理旧镜像"
            docker image prune -af || true
