name: CD - Build & Deploy

# 触发条件：仅 push 到 main 分支
on:
  push:
    branches: [main]

jobs:
  # 第一步：快速检查（无需等待外部 CI）
  check:
    name: Django 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django 系统检查
        run: python manage.py check

      - name: 运行测试
        run: python manage.py test

  # 第二步：检查通过后同步代码并部署
  build-and-deploy:
    name: 同步代码 → 服务器本地构建 → 部署
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 服务器无法稳定访问 GitHub HTTPS / GHCR，因此由 CI 打包代码通过 SSH 上传，
      # 服务器只负责本地 docker compose build + up，不再从外部拉取代码/镜像。
      # 注意：scp-action 的 source 必须是 workspace 内相对路径，不能是 /tmp 绝对路径。
      - name: 打包代码（输出到 workspace 内）
        run: |
          tar -czf deploy.tar.gz --exclude='.git' --exclude='data' --exclude='__pycache__' --exclude='*.pyc' --exclude='.venv' --exclude='node_modules' .

      - name: 上传代码到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: ${{ secrets.DEPLOY_PATH }}
          timeout: 5m
          command_timeout: 10m
          debug: true
          strip_components: 0
          overwrite: true

      - name: 远程部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "==> 解压最新代码"
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            echo "==> 本地构建镜像（绕过 GHCR 拉取超时）"
            docker compose -f docker-compose.yml build --no-cache
            echo "==> 启动容器"
            docker compose -f docker-compose.yml up -d --remove-orphans
            echo "==> 清理旧镜像"
            docker image prune -af || true
