name: CD - Build & Deploy

# 触发条件：仅 push 到 main 分支
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cc468547730/my-blog

jobs:
  # 第一步：快速检查（无需等待外部 CI）
  check:
    name: Django 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django 系统检查
        run: python manage.py check

      - name: 运行测试
        run: python manage.py test

  # 第二步：检查通过后构建镜像并部署
  build-and-deploy:
    name: 构建镜像 → 推送 GHCR → 部署
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
          # 注意：需在仓库 Secrets 配置 GHCR_TOKEN（含 write:packages 权限的 PAT 或 GHCR 专用令牌）

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 远程部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "==> 登录 GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "==> 拉取最新镜像（国内网络可能较慢，请耐心等待）"
            time docker compose -f docker-compose.yml pull
            echo "==> 重启容器"
            docker compose -f docker-compose.yml up -d --remove-orphans
            echo "==> 清理旧镜像"
            docker image prune -af || true
