name: CD - Build & Deploy

# 触发条件：仅 push 到 main 分支
on:
  push:
    branches: [main]

env:
  # 腾讯云 TCR 配置（服务器同为腾讯云，同厂商拉取最稳最快，规避 GHCR 超时）
  # TCR_REGISTRY 为腾讯云容器镜像服务公网域名（个人版/标准版通用）
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: cc468547730
  IMAGE_NAME: my-blog

jobs:
  # 第一步：快速检查（无需等待外部 CI）
  check:
    name: Django 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django 系统检查
        run: python manage.py check

      - name: 运行测试
        run: python manage.py test

  # 第二步：检查通过后构建镜像并部署
  build-and-deploy:
    name: 构建镜像 → 推送腾讯云 TCR → 部署
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云 TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
          # 注意：需在仓库 Secrets 配置
          #   TCR_USERNAME  = 腾讯云账号 ID（如 100012345678）或子账号（最佳：CAM 子账号，仅授予 TCR 权限）
          #   TCR_PASSWORD  = 腾讯云「访问管理 CAM」中该账号的《容器镜像服务》登录密码
          #                     （在 TCR 控制台「镜像仓库 → 我的镜像 → 右侧「快捷指令」里有 docker login 命令可复制）

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 远程部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "==> 登录腾讯云 TCR"
            echo "${{ secrets.TCR_PASSWORD }}" | docker login ${{ env.TCR_REGISTRY }} -u ${{ secrets.TCR_USERNAME }} --password-stdin
            echo "==> 拉取最新镜像（TCR 同厂商，速度稳定）"
            time docker compose -f docker-compose.yml pull
            echo "==> 重启容器"
            docker compose -f docker-compose.yml up -d --remove-orphans
            echo "==> 清理旧镜像"
            docker image prune -af || true
