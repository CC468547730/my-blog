{% extends "blog/base.html" %}
{% load static %}

{% block title %}页面未开垦 - 我的博客{% endblock %}

{% block extra_head %}
<style>
    .empty-page {
        text-align: center;
        padding: 40px 20px 56px;
    }
    .empty-page .empty-illu {
        width: 200px;
        max-width: 70%;
        margin: 0 auto 24px;
        display: block;
        filter: drop-shadow(0 10px 20px rgba(79, 70, 229, 0.18));
        animation: floaty 3.2s ease-in-out infinite;
    }
    @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    .empty-page .empty-title {
        font-size: 22px;
        font-weight: 800;
        color: var(--cnb-text);
        margin-bottom: 10px;
    }
    .empty-page .empty-text {
        color: var(--cnb-muted);
        font-size: 15px;
        line-height: 1.8;
        max-width: 420px;
        margin: 0 auto 26px;
    }
    .empty-page .empty-text b {
        color: var(--cnb-primary);
        font-weight: 700;
    }
    .empty-page .empty-actions .btn-primary {
        display: inline-block;
        background: var(--cnb-primary);
        border: 1px solid var(--cnb-primary);
        color: #fff;
        border-radius: 999px;
        padding: 10px 26px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
    }
    .empty-page .empty-actions .btn-primary:hover {
        background: var(--cnb-primary-dark);
        color: #fff;
    }
    .empty-page .empty-actions .btn-ghost {
        display: inline-block;
        border-radius: 999px;
        padding: 10px 26px;
        font-weight: 600;
        font-size: 15px;
        color: var(--cnb-primary);
        border: 1px solid var(--cnb-border);
        margin-left: 10px;
        text-decoration: none;
        background: transparent;
        cursor: pointer;
    }
    .empty-page .empty-actions .btn-ghost:hover {
        background: var(--cnb-primary);
        color: #fff;
        border-color: var(--cnb-primary);
    }
</style>
{% endblock %}

{% block content %}
<div class="post-card empty-page">
    <img src="{% static 'img/empty_cliff.png' %}" alt="悬崖边的小人" class="empty-illu">
    <div class="empty-title">哎呀，这片数字领地还未开垦～</div>
    <div class="empty-text">
        我们目前只准备了 <b>{{ total_pages }}</b> 页宝藏，您已经探索完毕。<br>
        要不去首页吹吹风？
    </div>
    <div class="empty-actions">
        <a href="{% url 'blog:article_list' %}" class="btn-primary">回到首页</a>
        <a href="{% url 'blog:article_list' %}?page=1" class="btn-ghost">从第一页出发</a>
    </div>
</div>
{% endblock %}
