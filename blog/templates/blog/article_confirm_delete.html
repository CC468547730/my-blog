{% extends "blog/base.html" %}
{% load static %}

{% block title %}删除文章 - 我的博客{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3 text-danger">确认删除</h2>
                <p>你确定要删除文章《<strong>{{ object.title }}</strong>》吗？此操作不可撤销。</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">确认删除</button>
                        <a href="{% url 'blog:article_detail' object.pk %}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
