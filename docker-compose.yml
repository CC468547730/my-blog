services:
  # PostgreSQL 数据库服务（数据持久化到 ./data/postgres）
  db:
    image: postgres:16-alpine
    container_name: my-blog-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 采用「CI 构建镜像 → 推送 GHCR → 服务器 pull 运行」模式，
  # 因此此处只声明 image（来自 GHCR），不写 build（避免服务器本地构建）。
  # SECRET_KEY / ALLOWED_HOSTS / DATABASE_URL 等变量由同目录 .env 文件注入（env_file）。
  web:
    image: ghcr.io/cc468547730/my-blog:latest
    container_name: my-blog
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 兜底默认值，确保即使 .env 缺失也不会启动失败
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,linkuphub.top,www.linkuphub.top"
      DATABASE_URL: "${DATABASE_URL}"
    volumes:
      - ./data/staticfiles:/app/staticfiles
      - ./data/media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
