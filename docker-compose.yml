services:
  # 采用「服务器本地构建镜像 → 直接启动」模式。
  # 原因：GHCR 到该腾讯云服务器网络极不稳定，docker pull 经常卡在 fs layer 导致超时。
  # 改为本地 build 后，完全绕过 GHCR 拉取，利用服务器本地代码和 Dockerfile 构建镜像。
  # SECRET_KEY / ALLOWED_HOSTS / DATABASE_URL 等变量由同目录 .env 文件注入（env_file）。
  #
  # 网络说明：使用 host 网络模式（network_mode: host），容器直接共享宿主机网络栈。
  # 这样容器内 127.0.0.1:5432 即宿主 PostgreSQL、127.0.0.1:8000 即 Gunicorn，
  # 彻底规避 Docker 网桥路由/防火墙导致的容器→宿主机连通问题（已生产验证）。
  # 注意：host 模式下 ports 映射与 extra_hosts 均不生效，已移除。
  web:
    build: .
    image: my-blog:local
    container_name: my-blog
    # 共享宿主机网络，容器内 localhost 即宿主机服务
    network_mode: "host"
    env_file:
      - .env
    environment:
      # 兜底默认值，确保即使 .env 缺失也不会启动失败
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,linkuphub.top,www.linkuphub.top"
      # host 模式下直接用 127.0.0.1 访问宿主 PostgreSQL（覆盖 .env 同名变量）
      DATABASE_URL: "postgresql://myblog_user:MyBlog_Passw0rd@127.0.0.1:5432/myblog"
    volumes:
      - ./data/staticfiles:/app/staticfiles
      - ./data/media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
