{% extends "blog/base.html" %}

{% block title %}已登出{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 460px; margin-top: 60px;">
    <div class="card-body text-center p-5">
        <div class="mb-3" style="font-size: 2.5rem; color: var(--cnb-blue);">
            <i class="bi bi-check-circle"></i>
        </div>
        <h4 class="fw-bold mb-2">您已成功登出</h4>
        <p class="text-muted">感谢使用，期待您的再次到来。</p>
        <div class="mt-4">
            <a href="{% url 'users:login' %}" class="btn btn-primary me-2">重新登录</a>
            <a href="{% url 'blog:article_list' %}" class="btn btn-outline-secondary">返回首页</a>
        </div>
    </div>
</div>
{% endblock %}
