{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 · 门扉紧闭</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --dash-primary: #4f46e5;
            --dash-primary-dark: #4338ca;
            --dash-sidebar-bg: #0f172a;
            --dash-sidebar-bg2: #1e1b4b;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            background: linear-gradient(160deg, #1e1b4b 0%, #0f172a 55%, #020617 100%);
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* 漂浮光斑 */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .45;
            pointer-events: none;
            animation: float 9s ease-in-out infinite;
        }
        .glow.a { width: 380px; height: 380px; background: #6366f1; top: -80px; left: -60px; }
        .glow.b { width: 320px; height: 320px; background: #0ea5e9; bottom: -90px; right: -40px; animation-delay: 2s; }
        .glow.c { width: 260px; height: 260px; background: #8b5cf6; top: 40%; left: 55%; animation-delay: 4s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.08); }
        }
        .door-wrap {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 48px 36px;
            max-width: 560px;
        }
        .door-icon {
            font-size: 5.5rem;
            color: #818cf8;
            text-shadow: 0 0 30px rgba(129,140,248,.5);
            animation: swing 5s ease-in-out infinite;
            transform-origin: top center;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(6deg); }
            75% { transform: rotate(-6deg); }
        }
        .code-403 {
            font-size: 1.1rem;
            letter-spacing: .5em;
            color: #94a3b8;
            margin: 18px 0 6px;
            text-indent: .5em;
        }
        .title-main {
            font-size: 2.1rem;
            font-weight: 700;
            margin: 0 0 14px;
            background: linear-gradient(90deg, #c7d2fe, #a5b4fc, #e0e7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 1.05rem;
            color: #cbd5e1;
            margin: 0 auto 34px;
            line-height: 1.7;
            max-width: 420px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 999px;
            font-size: .98rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, var(--dash-primary), #7c3aed);
            box-shadow: 0 8px 24px rgba(79,70,229,.35);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .btn-back:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(79,70,229,.5);
        }
        .btn-back.secondary {
            background: rgba(255,255,255,.08);
            box-shadow: none;
            border: 1px solid rgba(255,255,255,.18);
            margin-left: 12px;
        }
        .btn-back.secondary:hover { background: rgba(255,255,255,.16); }
        @media (max-width: 480px) {
            .title-main { font-size: 1.6rem; }
            .door-icon { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="glow c"></div>

    <div class="door-wrap">
        <div class="door-icon"><i class="bi bi-door-closed-fill"></i></div>
        <div class="code-403">4 0 3</div>
        <h1 class="title-main">门扉紧闭，光影未至。</h1>
        <p class="subtitle">你寻找的风景，不在这一帧。</p>
        <div>
            {% if user.is_authenticated %}
                <a class="btn-back" href="{% url 'blog:article_create' %}"><i class="bi bi-pencil-square"></i> 返回发布页</a>
            {% else %}
                <a class="btn-back" href="{% url 'users:login' %}"><i class="bi bi-box-arrow-in-right"></i> 前往登录</a>
            {% endif %}
            <a class="btn-back secondary" href="{% url 'blog:article_list' %}"><i class="bi bi-house"></i> 回到首页</a>
        </div>
    </div>
</body>
</html>
