# ============================================================
#  My-Blog Nginx 配置示例（反向代理 + 静态文件直出）
#  用途：域名 -> gunicorn(127.0.0.1:8000)，静态资源由 Nginx 直接服务
#  把下面内容保存为 /etc/nginx/conf.d/myblog.conf 或站点配置
# ============================================================

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或服务器IP

    # 上传的用户文件（MEDIA_ROOT = /opt/my-blog/media）
    location /media/ {
        alias /opt/my-blog/media/;
        expires 30d;
        access_log off;
    }

    # 收集的静态文件（STATIC_ROOT = /opt/my-blog/staticfiles）
    location /static/ {
        alias /opt/my-blog/staticfiles/;
        expires 30d;
        access_log off;
    }

    # 反向代理到 gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 可选：上传大文件（如图片）时调大
    client_max_body_size 10m;
}
