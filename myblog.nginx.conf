# ============================================================
#  My-Blog Nginx 配置（反向代理 + 静态文件直出）
#  用途：域名 -> gunicorn(127.0.0.1:8000)，静态资源由 Nginx 直接服务
#  适用场景：Docker 部署（server-init.sh 会自动生成等价配置到
#            /etc/nginx/sites-available/myblog，本文件作为参考模板）
#  部署根目录约定：/home/deploy/my-blog
#  使用方法（手动部署时）：
#    sudo cp myblog.nginx.conf /etc/nginx/sites-available/myblog
#    sudo ln -sf /etc/nginx/sites-available/myblog /etc/nginx/sites-enabled/myblog
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name linkuphub.top www.linkuphub.top;   # 站点域名（需与 ALLOWED_HOSTS 一致）

    # 用户上传文件（MEDIA_ROOT = <项目根目录>/data/media）
    location /media/ {
        alias /home/deploy/my-blog/data/media/;
        expires 30d;
        access_log off;
    }

    # 收集的静态文件（STATIC_ROOT = <项目根目录>/data/staticfiles）
    location /static/ {
        alias /home/deploy/my-blog/data/staticfiles/;
        expires 30d;
        access_log off;
    }

    # 反向代理到 gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 可选：上传大文件（如图片）时调大
    client_max_body_size 10m;
}
